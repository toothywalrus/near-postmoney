[workspace]
members = ["safe-math", "postmoney", "test-usdc"]
# Resolver 3 picks dependency versions that build on our rust-version (1.86, the toolchain NEAR's runtime accepts).
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.86"
repository = "https://github.com/toothywalrus/near-postmoney"
license = "MIT"

[workspace.dependencies]
near-sdk = "=5.27.0"
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

[profile.test]
opt-level = 2
debug = false
